<!-- title: Sign in — BalVoice -->
<!-- description: Sign in to your BalVoice account to manage voice broadcast campaigns. -->
<!-- layout: auth -->
<!-- robots: noindex,follow -->

<div data-auth-page="login">
  <h1>Sign in</h1>
  <p class="auth-sub">For BalVoice staff. Accounts are created by an administrator.</p>

  <div class="auth-alert" id="auth-alert" role="alert" hidden></div>

  <button type="button" class="btn-provider" data-oauth="google">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.96 8.96 0 0 0 9 0 9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
    Continue with Google
  </button>

  <div class="auth-divider"><span>or</span></div>

  <div class="auth-tabs" role="tablist" aria-label="Sign-in method">
    <button type="button" role="tab" id="tab-email" aria-controls="panel-email" aria-selected="true">Email</button>
    <button type="button" role="tab" id="tab-phone" aria-controls="panel-phone" aria-selected="false" tabindex="-1">Phone</button>
  </div>

  <form class="auth-form" id="panel-email" role="tabpanel" aria-labelledby="tab-email" data-form="email-login" novalidate>
    <div class="field">
      <label for="li-email">Email address</label>
      <input class="input" id="li-email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="160" required>
      <span class="field-error" role="alert"></span>
    </div>
    <div class="field">
      <div class="label-row"><label for="li-password">Password</label><a href="forgot-password.html" class="small">Forgot password?</a></div>
      <div class="password-wrap">
        <input class="input" id="li-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="button" class="pw-toggle" data-pw-toggle="li-password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <span class="field-error" role="alert"></span>
    </div>
    <div class="captcha" data-captcha></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <form class="auth-form" id="panel-phone" role="tabpanel" aria-labelledby="tab-phone" data-form="phone-login" novalidate hidden>
    <div data-step="phone">
      <div class="field">
        <label for="lp-phone">Phone number</label>
        <div class="phone-input">
          <label class="sr-only" for="lp-country">Country code</label>
          <select class="select" id="lp-country" data-country></select>
          <input class="input" id="lp-phone" name="phone" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="16" placeholder="24 123 4567" required>
        </div>
        <span class="hint">We'll text you a 6-digit code. Standard SMS rates may apply.</span>
        <span class="field-error" role="alert"></span>
      </div>
      <div class="captcha" data-captcha></div>
      <button class="btn btn-primary btn-block" type="submit">Send code</button>
    </div>
    <div data-step="code" hidden>
      <p class="auth-note">Enter the code sent to <strong data-phone-display></strong>. <button type="button" class="auth-linkbtn" data-change-phone>Change number</button></p>
      <div class="field">
        <label for="lp-code">6-digit code</label>
        <input class="input otp-input" id="lp-code" name="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
        <span class="field-error" role="alert"></span>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Verify and sign in</button>
      <p class="auth-resend"><button type="button" class="auth-linkbtn" data-resend disabled>Resend code</button> <span data-countdown></span></p>
    </div>
  </form>
</div>
