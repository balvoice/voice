<!-- title: Choose a new password — BalVoice -->
<!-- description: Choose a new password for your BalVoice account. -->
<!-- layout: auth -->
<!-- robots: noindex,nofollow -->

<div data-auth-page="reset">
  <h1>Choose a new password</h1>
  <p class="auth-sub" data-reset-intro>Checking your reset link…</p>

  <div class="auth-alert" id="auth-alert" role="alert" hidden></div>

  <form class="auth-form" data-form="reset" novalidate hidden>
    <div class="field">
      <label for="rp-password">New password</label>
      <div class="password-wrap">
        <input class="input" id="rp-password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="pw-rules">
        <button type="button" class="pw-toggle" data-pw-toggle="rp-password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div class="pw-meter" aria-hidden="true"><span data-pw-meter></span></div>
      <ul class="pw-rules" id="pw-rules">
        <li data-rule="length">At least 10 characters</li>
        <li data-rule="mix">Upper and lower case letters</li>
        <li data-rule="digit">At least one number</li>
      </ul>
      <span class="field-error" role="alert"></span>
    </div>
    <div class="field">
      <label for="rp-confirm">Confirm new password</label>
      <input class="input" id="rp-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required>
      <span class="field-error" role="alert"></span>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div>
