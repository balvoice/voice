<!-- title: Reset your password — BalVoice -->
<!-- description: Request a link to reset your BalVoice password. -->
<!-- layout: auth -->
<!-- robots: noindex,follow -->

<div data-auth-page="forgot">
  <h1>Reset your password</h1>
  <p class="auth-sub">Enter the email address you signed up with. If it matches an account, we'll send a link to choose a new password.</p>

  <div class="auth-alert" id="auth-alert" role="alert" hidden></div>

  <form class="auth-form" data-form="forgot" novalidate>
    <div class="field">
      <label for="fp-email">Email address</label>
      <input class="input" id="fp-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="160" required>
      <span class="field-error" role="alert"></span>
    </div>
    <div class="captcha" data-captcha></div>
    <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
  </form>

  <p class="auth-sub mt-24">Signed up with your phone or Google? <a href="login.html">Sign in that way instead</a> — those accounts don't use a password.</p>
</div>
