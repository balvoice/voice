<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F5F7FA;font-family:Arial,Helvetica,sans-serif;color:#1B2533;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F7FA;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border:1px solid #DCE2EA;border-radius:8px;">
        <tr><td style="padding:24px 32px;border-bottom:1px solid #DCE2EA;font-size:18px;font-weight:bold;color:#13233D;">BalVoice</td></tr>
        <tr><td style="padding:28px 32px;">
          <h1 style="margin:0 0 12px;font-size:20px;color:#0E1726;">Confirm your new email address</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#536173;">Confirm that you want to use {{ .NewEmail }} for your BalVoice account.</p>
          <p style="margin:0 0 24px;"><a href="{{ .SiteURL }}/auth-callback.html?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;background:#1D5BBF;color:#FFFFFF;text-decoration:none;padding:12px 22px;border-radius:4px;font-size:15px;font-weight:bold;">Confirm new email</a></p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#758194;">If you didn't request this change, contact us straight away.</p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#758194;">BalVoice — automated voice broadcast campaigns</p>
    </td></tr>
  </table>

</html>
